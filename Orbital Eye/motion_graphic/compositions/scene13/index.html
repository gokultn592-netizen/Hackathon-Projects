<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 13 – Cinematic Closing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      overflow: hidden;
    }

    /* ── SVG ORBITS LAYER ───────────────────────────────────────── */
    #orbits-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* ── CENTER CONTENT GROUP ───────────────────────────────────── */
    #content-group {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
    }

    #title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      margin-bottom: 24px;
      opacity: 0;
    }

    #text-orbital {
      font-size: 96px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.25em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.25);
    }

    #text-eye {
      font-size: 96px;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 0.25em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(0, 212, 255, 0.45);
    }

    #tagline {
      font-size: 22px;
      font-style: italic;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.05em;
      line-height: 1.4;
      opacity: 0;
    }

    /* ── FULL SCREEN FADE TO BLACK OVERLAY ──────────────────────── */
    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene13"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Orbit Ellipses -->
    <svg id="orbits-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!-- Orbit 1: wide, tilted -15° -->
      <ellipse
        id="orbit1"
        cx="960" cy="540"
        rx="780" ry="260"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.2"
        transform="rotate(-15 960 540)"
      />

      <!-- Orbit 2: medium, tilted +30° -->
      <ellipse
        id="orbit2"
        cx="960" cy="540"
        rx="560" ry="200"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.2"
        transform="rotate(30 960 540)"
      />

      <!-- Orbit 3: tall, tilted +60° -->
      <ellipse
        id="orbit3"
        cx="960" cy="540"
        rx="320" ry="380"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.2"
        transform="rotate(60 960 540)"
      />
    </svg>

    <!-- Center Content -->
    <div id="content-group">
      <div id="title-row">
        <span id="text-orbital">ORBITAL</span>
        <span id="text-eye">EYE</span>
      </div>
      <div id="tagline">The future of space is collision-free.</div>
    </div>

    <!-- Final blackout overlay -->
    <div id="fade-overlay"></div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      // ── Helper: calculate ellipse circumference for strokeDash ─────────────
      // Ramanujan approximation: π * (3(a+b) − √((3a+b)(a+3b)))
      function ellipsePerimeter(rx, ry) {
        return Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
      }

      const orbitDefs = [
        { id: 'orbit1', rx: 780, ry: 260 },
        { id: 'orbit2', rx: 560, ry: 200 },
        { id: 'orbit3', rx: 320, ry: 380 },
      ];

      orbitDefs.forEach(function (def) {
        const el = document.getElementById(def.id);
        const len = ellipsePerimeter(def.rx, def.ry);
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });

      // ── Master GSAP timeline ───────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // 0–1s: Screen is pure black (title-row and tagline opacity: 0)

      // 1s: "ORBITAL EYE" appears with majestic slow fade + slight rise
      tl.fromTo('#title-row',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' },
        1.0
      );

      // 3s: Tagline fades in below
      tl.fromTo('#tagline',
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' },
        3.0
      );

      // 5s: Three orbit ellipses slowly draw themselves around title
      tl.to('#orbit1', {
        strokeDashoffset: 0,
        duration: 1.8,
        ease: 'power2.inOut',
      }, 5.0);

      tl.to('#orbit2', {
        strokeDashoffset: 0,
        duration: 1.8,
        ease: 'power2.inOut',
      }, 5.1);

      tl.to('#orbit3', {
        strokeDashoffset: 0,
        duration: 1.8,
        ease: 'power2.inOut',
      }, 5.2);

      // 7s: Slow fade to black — everything dims over 1 second
      tl.to('#content-group', {
        opacity: 0,
        duration: 1.0,
        ease: 'power2.inOut',
      }, 7.0);

      tl.to('#orbits-svg', {
        opacity: 0,
        duration: 1.0,
        ease: 'power2.inOut',
      }, 7.0);

      tl.fromTo('#fade-overlay',
        { opacity: 0 },
        { opacity: 1, duration: 1.0, ease: 'power2.inOut' },
        7.0
      );

      // 8s: Pure black. End.

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene13'] = tl;
    })();
  </script>
</body>
</html>
