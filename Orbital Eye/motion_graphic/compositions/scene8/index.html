<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 8 – Collision Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
    }

    /* ── LEFT PANEL ─────────────────────────────────────────────── */
    #left-panel {
      position: absolute;
      left: 100px;
      top: 0;
      width: 280px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    #step-label {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: 0;
    }

    /* Vertical progress bar — 3 segments, 2nd lit cyan */
    #progress-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
    }

    .seg {
      width: 3px;
      height: 60px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
    }

    .seg.active {
      background: #00d4ff;
      box-shadow: 0 0 8px 2px rgba(0, 212, 255, 0.5);
    }

    /* ── RIGHT PANEL ────────────────────────────────────────────── */
    #right-panel {
      position: absolute;
      left: 480px;
      top: 0;
      width: 1320px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    /* Thin cyan rule above title */
    #rule-top {
      width: 64px;
      height: 2px;
      background: #00d4ff;
      margin-bottom: 28px;
      opacity: 0;
    }

    #title {
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      line-height: 1.1;
      margin-bottom: 40px;
      opacity: 0;
    }

    /* ── STATS CARDS ────────────────────────────────────────────── */
    #cards-container {
      display: flex;
      gap: 20px;
      width: 860px;
      margin-bottom: 36px;
    }

    .stat-card {
      flex: 1;
      padding: 24px 22px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 116px;
      opacity: 0;
    }

    .card-condition {
      font-size: 15px;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    .card-result {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    #card-a {
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.07);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.12);
    }
    #card-a .card-result {
      color: #ef4444;
    }

    #card-b {
      border: 1px solid #f59e0b;
      background: rgba(245, 158, 11, 0.07);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.12);
    }
    #card-b .card-result {
      color: #f59e0b;
    }

    #card-c {
      border: 1px solid #22c55e;
      background: rgba(34, 197, 94, 0.07);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.12);
    }
    #card-c .card-result {
      color: #22c55e;
    }

    /* ── API RESPONSE BOX ───────────────────────────────────────── */
    #api-block {
      max-width: 860px;
      background: rgba(0, 212, 255, 0.04);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-left: 3px solid #00d4ff;
      border-radius: 0 8px 8px 0;
      padding: 24px 32px;
      opacity: 0;
    }

    .api-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.12);
    }

    .api-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(0, 212, 255, 0.7);
      text-transform: uppercase;
    }

    .api-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #22c55e;
      letter-spacing: 0.1em;
    }

    #api-block code {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px;
      color: #00d4ff;
      letter-spacing: 0.04em;
      line-height: 1.6;
      white-space: pre;
      display: block;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene8"
    data-start="0"
    data-duration="12"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Left panel -->
    <div id="left-panel">
      <div id="step-label">02 &nbsp;/&nbsp; 03</div>
      <div id="progress-bar">
        <div class="seg"></div>
        <div class="seg active"></div>
        <div class="seg"></div>
      </div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">
      <div id="rule-top"></div>
      <div id="title">COLLISION PREDICTION</div>

      <!-- Stats Cards -->
      <div id="cards-container">
        <!-- Card A -->
        <div class="stat-card" id="card-a">
          <div class="card-condition">Miss Distance &lt; 5km</div>
          <div class="card-result">→ RED</div>
        </div>

        <!-- Card B -->
        <div class="stat-card" id="card-b">
          <div class="card-condition">Miss Distance 5–20km</div>
          <div class="card-result">→ AMBER</div>
        </div>

        <!-- Card C -->
        <div class="stat-card" id="card-c">
          <div class="card-condition">Miss Distance &gt; 20km</div>
          <div class="card-result">→ GREEN</div>
        </div>
      </div>

      <!-- API response snippet -->
      <div id="api-block">
        <div class="api-header">
          <span class="api-title">POST /api/v1/predict &nbsp;·&nbsp; RESPONSE</span>
          <span class="api-status">200 OK</span>
        </div>
        <code>{
  "sat_a_name": "Iridium 33",
  "sat_b_name": "Cosmos 2251",
  "miss_distance_km": 0.00,
  "collision_prob": 1.0
}</code>
      </div>
    </div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ── Left panel ────────────────────────────────────────────────────────

      // 0.4s: step label fades in
      tl.to('#step-label', {
        opacity: 1,
        duration: 0.5,
        ease: 'power2.out',
      }, 0.4);

      // 0.7s: progress bar fades in
      tl.to('#progress-bar', {
        opacity: 1,
        duration: 0.5,
        ease: 'power2.out',
      }, 0.7);

      // ── Right panel ───────────────────────────────────────────────────────

      // 0.6s: rule draws in (scaleX 0→1, transform-origin left)
      tl.fromTo('#rule-top',
        { opacity: 0, scaleX: 0, transformOrigin: 'left center' },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power2.out' },
        0.6
      );

      // 1.0s: title slides in from right
      tl.fromTo('#title',
        { opacity: 0, x: 80 },
        { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' },
        1.0
      );

      // Stats cards animate in staggered by 1.0s:
      // Card A at 2.0s
      tl.fromTo('#card-a',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        2.0
      );

      // Card B at 3.0s (1s stagger)
      tl.fromTo('#card-b',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        3.0
      );

      // Card C at 4.0s (1s stagger)
      tl.fromTo('#card-c',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        4.0
      );

      // At 7s: API response example fades in
      tl.to('#api-block', {
        opacity: 1,
        duration: 0.7,
        ease: 'power2.out',
      }, 7.0);

      // 12s: hold

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene8'] = tl;
    })();
  </script>
</body>
</html>
