<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 7 – TLE Data Ingestion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
    }

    /* ── LEFT PANEL ─────────────────────────────────────────────── */
    #left-panel {
      position: absolute;
      left: 100px;
      top: 0;
      width: 280px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    #step-label {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: 0;
    }

    /* Vertical progress bar — 3 segments */
    #progress-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
    }

    .seg {
      width: 3px;
      height: 60px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
    }

    .seg.active {
      background: #00d4ff;
      box-shadow: 0 0 8px 2px rgba(0, 212, 255, 0.5);
    }

    /* ── RIGHT PANEL ────────────────────────────────────────────── */
    #right-panel {
      position: absolute;
      left: 480px;
      top: 0;
      width: 1320px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    /* Thin cyan rule above title */
    #rule-top {
      width: 64px;
      height: 2px;
      background: #00d4ff;
      margin-bottom: 28px;
      opacity: 0;
      /* GSAP animates scaleX from 0 → 1; transform-origin handled via gsap */
    }

    #title {
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      line-height: 1.1;
      margin-bottom: 48px;
      opacity: 0;
      /* GSAP fromTo: slides in from right — no CSS transform */
    }

    .body-line {
      font-size: 16px;
      font-weight: 400;
      color: #aaaaaa;
      letter-spacing: 0.04em;
      line-height: 1.6;
      margin-bottom: 8px;
      opacity: 0;
      /* GSAP fromTo: x from right */
    }

    /* ── Code snippet ───────────────────────────────────────────── */
    #code-block {
      margin-top: 48px;
      padding: 24px 32px;
      background: rgba(0, 212, 255, 0.05);
      border-left: 3px solid #00d4ff;
      border-radius: 0 6px 6px 0;
      max-width: 860px;
      opacity: 0;
    }

    #code-block code {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px;
      color: #00d4ff;
      letter-spacing: 0.04em;
      line-height: 1.6;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene7"
    data-start="0"
    data-duration="12"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Left panel -->
    <div id="left-panel">
      <div id="step-label">01 &nbsp;/&nbsp; 03</div>
      <div id="progress-bar">
        <div class="seg active"></div>
        <div class="seg"></div>
        <div class="seg"></div>
      </div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">
      <div id="rule-top"></div>
      <div id="title">TLE DATA INGESTION</div>

      <div class="body-line" id="line1">CelesTrak &nbsp;·&nbsp; Starlink &nbsp;·&nbsp; OneWeb &nbsp;·&nbsp; Science TLEs</div>
      <div class="body-line" id="line2">orbital_eye_etl.py ingests satellite positions</div>
      <div class="body-line" id="line3">6 Oracle tables seeded with bind variables</div>

      <div id="code-block">
        <code>SELECT pair_id, miss_distance_km
  FROM encounter_pairs
 WHERE miss_distance_km &lt; 5
 ORDER BY miss_distance_km ASC;</code>
      </div>
    </div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ── Left panel ────────────────────────────────────────────────────────

      // 0.4s: step label fades in
      tl.to('#step-label', {
        opacity: 1,
        duration: 0.5,
        ease: 'power2.out',
      }, 0.4);

      // 0.7s: progress bar fades in
      tl.to('#progress-bar', {
        opacity: 1,
        duration: 0.5,
        ease: 'power2.out',
      }, 0.7);

      // ── Right panel ───────────────────────────────────────────────────────

      // 0.6s: rule draws in (scaleX 0→1, transform-origin left)
      tl.fromTo('#rule-top',
        { opacity: 0, scaleX: 0, transformOrigin: 'left center' },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power2.out' },
        0.6
      );

      // 1.0s: title slides in from right
      tl.fromTo('#title',
        { opacity: 0, x: 80 },
        { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' },
        1.0
      );

      // 2.5s: body lines stagger in from right, 0.4s apart
      ['#line1', '#line2', '#line3'].forEach(function (sel, i) {
        tl.fromTo(sel,
          { opacity: 0, x: 60 },
          { opacity: 1, x: 0, duration: 0.45, ease: 'power2.out' },
          2.5 + i * 0.4
        );
      });

      // 8s: code block fades in
      tl.to('#code-block', {
        opacity: 1,
        duration: 0.7,
        ease: 'power2.out',
      }, 8.0);

      // 12s: hold

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene7'] = tl;
    })();
  </script>
</body>
</html>
