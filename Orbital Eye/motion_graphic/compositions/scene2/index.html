<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 2 – Satellite Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    #counter {
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.05em;
      line-height: 1;
      opacity: 0;
      /* counter starts invisible, GSAP fades it in */
    }

    #subtitle {
      font-size: 18px;
      font-weight: 400;
      color: #aaaaaa;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 18px;
      opacity: 0;
    }

    #critical {
      font-size: 22px;
      font-weight: 700;
      color: #ff4444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 32px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!--
    HyperFrames composition root
    data-composition-id : unique identifier
    data-start          : global start time in seconds (0)
    data-duration       : total duration in seconds (6)
    data-width          : canvas width  (1920)
    data-height         : canvas height (1080)
    data-fps            : render frame-rate (30)
  -->
  <div
    id="stage"
    data-composition-id="scene2"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <div id="counter">0</div>
    <div id="subtitle">active satellites tracked</div>
    <div id="critical">Miss distance &lt; 5km: CRITICAL</div>
  </div>

  <!-- GSAP 3 (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      // ── Helpers ────────────────────────────────────────────────────────────
      const counterEl  = document.getElementById('counter');
      const subtitleEl = document.getElementById('subtitle');
      const criticalEl = document.getElementById('critical');

      // ── Master GSAP timeline (seekable by HyperFrames) ────────────────────
      const tl = gsap.timeline({ paused: true });

      // 0s → 0.2s: fade counter + subtitle in together
      tl.to(counterEl,  { opacity: 1, duration: 0.2, ease: 'none' }, 0);
      tl.to(subtitleEl, { opacity: 1, duration: 0.3, ease: 'none' }, 0.1);

      // 0s → 4s: count up 0 → 27000, easeOut
      const countObj = { value: 0 };
      tl.to(
        countObj,
        {
          value: 27000,
          duration: 4,
          ease: 'power3.out',
          onUpdate: function () {
            counterEl.textContent = Math.round(countObj.value).toLocaleString('en-US');
          },
        },
        0  // start at t=0 alongside the fade-in
      );

      // 5s → 5.5s: critical line fades in
      tl.to(criticalEl, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 5);

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene2'] = tl;
    })();
  </script>
</body>
</html>
