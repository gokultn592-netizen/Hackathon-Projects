<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 6 – Transition to Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      overflow: hidden;
    }

    /* ── Horizontal divider line (SVG) ────────────────────────────── */
    #divider-svg {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    #divider-line {
      stroke: #00d4ff;
      stroke-width: 1.5;
      stroke-opacity: 0.8;
    }

    /* ── Text blocks — all centred ───────────────────────────────── */
    #text-above {
      position: absolute;
      width: 1920px;
      text-align: center;
      /* sits above centre line (y=540); pushed up by 90px */
      top: 390px;
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      opacity: 0;
    }

    #text-below {
      position: absolute;
      width: 1920px;
      text-align: center;
      /* sits below centre line; pushed down 48px */
      top: 600px;
      font-size: 20px;
      font-weight: 400;
      color: #00d4ff;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0;
    }

    #text-stack {
      position: absolute;
      width: 1920px;
      text-align: center;
      top: 660px;
      font-size: 12px;
      font-weight: 400;
      color: #888888;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene6"
    data-start="0"
    data-duration="10"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Horizontal cyan divider -->
    <svg id="divider-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!--
        Line from x=80 to x=1840 at y=540 (vertical centre).
        Total length = 1760. Dasharray = 1760, offset starts at 1760 (hidden).
      -->
      <line
        id="divider-line"
        x1="80" y1="540"
        x2="1840" y2="540"
        stroke-dasharray="1760"
        stroke-dashoffset="1760"
      />
    </svg>

    <!-- Text layers -->
    <div id="text-above">We built something.</div>
    <div id="text-below">Orbital Eye — DBMS Edition</div>
    <div id="text-stack">Oracle DB &nbsp;·&nbsp; FastAPI &nbsp;·&nbsp; React &nbsp;·&nbsp; TLE Data</div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // 0s–2s: black (nothing animated)

      // 2s: cyan line draws left → right over 0.8s
      tl.to('#divider-line', {
        strokeDashoffset: 0,
        duration: 0.8,
        ease: 'power2.inOut',
      }, 2.0);

      // 3s: "We built something." fades in
      tl.to('#text-above', {
        opacity: 1,
        duration: 0.6,
        ease: 'power2.out',
      }, 3.0);

      // 5s: subtitle fades in below line
      tl.to('#text-below', {
        opacity: 1,
        duration: 0.6,
        ease: 'power2.out',
      }, 5.0);

      // 7s: tech stack fades in
      tl.to('#text-stack', {
        opacity: 1,
        duration: 0.6,
        ease: 'power2.out',
      }, 7.0);

      // 10s: hold

      // ── Register with HyperFrames ─────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene6'] = tl;
    })();
  </script>
</body>
</html>
