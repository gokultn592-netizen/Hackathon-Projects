<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 12 – The Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #team-label {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
    }

    #team-names {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.05em;
      margin-bottom: 22px;
      opacity: 0;
    }

    #team-line {
      width: 380px;
      height: 1px;
      background: #00d4ff;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
      margin-bottom: 22px;
      opacity: 0;
    }

    #team-institution {
      font-size: 14px;
      font-weight: 400;
      color: #888888;
      letter-spacing: 0.1em;
      margin-bottom: 28px;
      opacity: 0;
    }

    #team-tagline {
      font-size: 14px;
      font-style: italic;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.06em;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene12"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Label -->
    <div id="team-label">THE TEAM</div>

    <!-- Team Names -->
    <div id="team-names">Gokulnath &nbsp;·&nbsp; Tamilmani &nbsp;·&nbsp; Harish</div>

    <!-- Thin cyan line under names -->
    <div id="team-line"></div>

    <!-- Institution -->
    <div id="team-institution">VIT Vellore &nbsp;·&nbsp; Integrated M.Tech Data Science</div>

    <!-- Tagline -->
    <div id="team-tagline">Built with passion. Built to last.</div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // At 1s: Title fades in: "THE TEAM"
      tl.to('#team-label', {
        opacity: 1,
        duration: 0.6,
        ease: 'power2.out',
      }, 1.0);

      // At 2s: Team names appear
      tl.fromTo('#team-names',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' },
        2.0
      );

      // At 3.5s: Institution fades in below
      tl.fromTo('#team-institution',
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' },
        3.5
      );

      // At 5s: Thin cyan horizontal line draws under names
      tl.fromTo('#team-line',
        { opacity: 0, scaleX: 0, transformOrigin: 'center center' },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: 'power2.out' },
        5.0
      );

      // At 6.5s: Tagline fades in
      tl.to('#team-tagline', {
        opacity: 1,
        duration: 0.7,
        ease: 'power2.out',
      }, 6.5);

      // 8s: hold

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene12'] = tl;
    })();
  </script>
</body>
</html>
