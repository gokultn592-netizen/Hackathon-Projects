<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 3 – Orbital Eye Title Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      overflow: hidden;
    }

    /* SVG orbit lines layer */
    #orbits-svg {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
    }

    /* Title group — centered */
    #title-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px;
      overflow: visible;
    }

    #text-orbital {
      font-size: 96px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3em;
      line-height: 1;
      /* clip so slam-in looks clean */
      clip-path: inset(-20px -200px -20px -200px);
      opacity: 0;
      /* initial y position set via GSAP, not CSS */
    }

    #text-eye {
      font-size: 96px;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 0.3em;
      line-height: 1;
      clip-path: inset(-20px -200px -20px -200px);
      opacity: 0;
      /* initial y position set via GSAP, not CSS */
    }

    #subtitle {
      font-size: 18px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 28px;
      opacity: 0;
    }

    /* Satellite dot — positioned via JS */
    #sat-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow:
        0 0 8px 3px rgba(0, 212, 255, 0.9),
        0 0 20px 8px rgba(0, 212, 255, 0.5),
        0 0 40px 16px rgba(0, 212, 255, 0.25);
      opacity: 0;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene3"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Orbit ellipses -->
    <svg id="orbits-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!--
        Three tilted ellipses centred around screen centre (960, 540).
        Each drawn so we can animate stroke-dashoffset to 0.
      -->

      <!-- Orbit 1: large, slightly tilted -->
      <ellipse
        id="orbit1"
        cx="960" cy="540"
        rx="780" ry="260"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.3"
        transform="rotate(-15 960 540)"
      />

      <!-- Orbit 2: medium, opposite tilt -->
      <ellipse
        id="orbit2"
        cx="960" cy="540"
        rx="560" ry="200"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.3"
        transform="rotate(30 960 540)"
      />

      <!-- Orbit 3: small, near-vertical -->
      <ellipse
        id="orbit3"
        cx="960" cy="540"
        rx="320" ry="380"
        fill="none"
        stroke="white"
        stroke-width="1"
        stroke-opacity="0.3"
        transform="rotate(60 960 540)"
      />
    </svg>

    <!-- Title text -->
    <div id="title-group">
      <div id="text-orbital">ORBITAL</div>
      <div id="text-eye">EYE</div>
      <div id="subtitle">Satellite Collision Avoidance System</div>
    </div>

    <!-- Satellite dot (positioned by JS onto orbit1) -->
    <div id="sat-dot"></div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      // ── Helper: get SVG ellipse circumference ──────────────────────────────
      // SVG does not expose getTotalLength() for <ellipse>, so we use canvas math.
      // Ramanujan approximation: π * (3(a+b) − √((3a+b)(a+3b)))
      function ellipsePerimeter(rx, ry) {
        return Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
      }

      // Initialise stroke-dasharray / dashoffset so orbits start invisible
      const orbitDefs = [
        { id: 'orbit1', rx: 780, ry: 260 },
        { id: 'orbit2', rx: 560, ry: 200 },
        { id: 'orbit3', rx: 320, ry: 380 },
      ];

      orbitDefs.forEach(function (def) {
        const el  = document.getElementById(def.id);
        const len = ellipsePerimeter(def.rx, def.ry);
        el.style.strokeDasharray  = len;
        el.style.strokeDashoffset = len;   // fully hidden
        el._perimLength = len;
      });

      // ── Satellite dot: place it at angle ~30° on orbit1 (tilted -15°) ───
      // Parametric point on orbit1 at t=30° (before tilt):
      //   x = cx + rx*cos(t), y = cy + ry*sin(t)
      // After rotating -15° around (cx,cy):
      const cx = 960, cy = 540;
      const rx1 = 780, ry1 = 260;
      const tRad = (30 * Math.PI) / 180;
      const tiltRad = (-15 * Math.PI) / 180;
      const px0 = rx1 * Math.cos(tRad);
      const py0 = ry1 * Math.sin(tRad);
      const satX = cx + px0 * Math.cos(tiltRad) - py0 * Math.sin(tiltRad);
      const satY = cy + px0 * Math.sin(tiltRad) + py0 * Math.cos(tiltRad);

      const satDot = document.getElementById('sat-dot');
      satDot.style.left = satX + 'px';
      satDot.style.top  = satY + 'px';

      // ── Master GSAP timeline ───────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // 0s–2s: Draw orbit lines sequentially with slight overlap
      // orbit1 draws from 0 → 0.8s
      tl.to('#orbit1', {
        strokeDashoffset: 0,
        duration: 0.9,
        ease: 'power2.inOut',
      }, 0);

      // orbit2 draws from 0.5s → 1.3s
      tl.to('#orbit2', {
        strokeDashoffset: 0,
        duration: 0.9,
        ease: 'power2.inOut',
      }, 0.5);

      // orbit3 draws from 1.0s → 1.9s
      tl.to('#orbit3', {
        strokeDashoffset: 0,
        duration: 0.9,
        ease: 'power2.inOut',
      }, 1.0);

      // 2s: ORBITAL slams in from top (fromTo keeps initial y in GSAP, avoids CSS conflict)
      tl.fromTo('#text-orbital',
        { opacity: 0, y: -120 },
        { opacity: 1, y: 0, duration: 0.28, ease: 'back.out(1.5)' },
      2.0);

      // 2.4s: EYE slams in from bottom
      tl.fromTo('#text-eye',
        { opacity: 0, y: 120 },
        { opacity: 1, y: 0, duration: 0.28, ease: 'back.out(1.5)' },
      2.4);

      // 3s: satellite dot fades in then immediately starts pulsing
      // Use fromTo for the pulse so opacity starts from 1 cleanly
      tl.to(satDot, {
        opacity: 1,
        duration: 0.3,
        ease: 'power2.out',
        overwrite: 'auto',
      }, 3.0);

      // 3.3s–6s: satellite dot pulses (scale + glow)
      tl.to(satDot, {
        scale: 1.6,
        opacity: 0.6,
        duration: 0.5,
        ease: 'power1.inOut',
        yoyo: true,
        repeat: 4,
        overwrite: 'auto',
      }, 3.3);

      // 4.5s: subtitle fades in
      tl.to('#subtitle', {
        opacity: 1,
        duration: 0.6,
        ease: 'power2.out',
      }, 4.5);

      // 6s: hold (no action needed — timeline just stops)

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene3'] = tl;
    })();
  </script>
</body>
</html>
