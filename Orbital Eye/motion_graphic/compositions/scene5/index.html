<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 5 – Debris Field Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      overflow: hidden;
    }

    /* ── Debris dots — JS-created, positioned individually ─────────── */
    .debris-dot {
      position: absolute;
      border-radius: 50%;
      background: #ffffff;
      /* no transform in CSS — GSAP owns x/y/opacity */
      opacity: 0;
    }

    /* ── Impact point ────────────────────────────────────────────────── */
    #impact-ring {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,68,68,0.35) 0%, transparent 70%);
      border: 2px solid #ef4444;
      box-shadow:
        0 0 18px 6px  rgba(239, 68, 68, 0.5),
        0 0 40px 14px rgba(239, 68, 68, 0.25);
      /* centered: left = 960 - 32, top = 540 - 32 */
      left: 928px;
      top: 508px;
      opacity: 0;
      /* no CSS transform — GSAP handles scale */
    }

    #impact-label {
      position: absolute;
      /* centred below the ring */
      left: 960px;
      top: 582px;
      /* shift left via JS after measuring width */
      font-size: 13px;
      font-weight: 600;
      color: #ef4444;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      white-space: nowrap;
    }

    /* ── Text overlay ─────────────────────────────────────────────────── */
    #overlay-text {
      position: absolute;
      top: 88px;
      left: 100px;
      font-size: 28px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.05em;
      line-height: 1.4;
      opacity: 0;
    }

    #overlay-text span {
      display: block;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene5"
    data-start="0"
    data-duration="10"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <!-- Debris dots injected by JS -->

    <!-- Impact ring -->
    <div id="impact-ring"></div>
    <div id="impact-label">Impact Point</div>

    <!-- Text overlay -->
    <div id="overlay-text">
      <span>One collision.</span>
      <span>Permanent consequences.</span>
    </div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      const stage   = document.getElementById('stage');
      const CX      = 960;   // canvas centre X
      const CY      = 540;   // canvas centre Y
      const DOT_COUNT = 80;

      // Seeded-ish deterministic random (lcg) so the field is identical
      // on every seek/render pass — avoids frame-to-frame inconsistency.
      let seed = 42;
      function rand() {
        seed = (seed * 1664525 + 1013904223) & 0xffffffff;
        return ((seed >>> 0) / 0xffffffff);
      }

      // ── Spawn dots ───────────────────────────────────────────────────────
      const dots = [];
      for (let i = 0; i < DOT_COUNT; i++) {
        const size    = 1 + rand() * 2;          // 1–3 px
        const finalOp = 0.4 + rand() * 0.6;      // 0.4–1.0

        // Explosion direction: full 360°, distance 80–820 px
        const angle = rand() * Math.PI * 2;
        const dist  = 80 + rand() * 740;
        const tx    = Math.cos(angle) * dist;
        const ty    = Math.sin(angle) * dist;

        // Dot starts at canvas centre (no CSS transform needed)
        const el = document.createElement('div');
        el.className = 'debris-dot';
        el.style.width  = size + 'px';
        el.style.height = size + 'px';
        // Position anchor at CX,CY; GSAP will move via x/y
        el.style.left = CX + 'px';
        el.style.top  = CY + 'px';
        stage.appendChild(el);

        dots.push({ el, size, finalOp, tx, ty, blink: i % 4 === 0 });
      }

      // Centre the impact label
      const lbl = document.getElementById('impact-label');
      // We'll shift it after the browser has laid it out — use rAF via GSAP
      // (approximation: label ~120px wide → shift -60px)
      lbl.style.marginLeft = '-60px';

      // ── Master GSAP timeline ─────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // 0s–4s: all dots explode outward from centre
      dots.forEach(function (d, i) {
        const duration = 2.5 + rand() * 1.5;   // 2.5–4s per dot
        const delay    = rand() * 0.4;          // 0–0.4s stagger

        tl.fromTo(
          d.el,
          { x: 0, y: 0, opacity: 0 },
          {
            x: d.tx,
            y: d.ty,
            opacity: d.finalOp,
            duration: duration,
            ease: 'power2.out',
          },
          delay   // position within master timeline
        );
      });

      // 4.5s onwards: blinking subset pulses
      dots.forEach(function (d) {
        if (!d.blink) return;
        tl.to(d.el, {
          opacity: 0.08,
          duration: 1,
          ease: 'power1.inOut',
          yoyo: true,
          repeat: 10,   // 20s of blinking — well past end of scene
          overwrite: 'auto',
        }, 4.5);
      });

      // 5s: impact ring slams in
      tl.fromTo('#impact-ring',
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' },
        5.0
      );

      // 5s: label fades in
      tl.to('#impact-label', {
        opacity: 1,
        duration: 0.3,
        ease: 'power2.out',
      }, 5.0);

      // 5.35s → 10s: impact ring pulses
      tl.to('#impact-ring', {
        scale: 1.6,
        opacity: 0.4,
        duration: 0.7,
        ease: 'power1.inOut',
        yoyo: true,
        repeat: 6,
        overwrite: 'auto',
      }, 5.35);

      // 6s: overlay text fades in
      tl.to('#overlay-text', {
        opacity: 1,
        duration: 0.7,
        ease: 'power2.out',
      }, 6.0);

      // 10s: hold

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene5'] = tl;
    })();
  </script>
</body>
</html>
