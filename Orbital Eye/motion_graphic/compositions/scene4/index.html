<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 4 – Problem Statement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Space Grotesk', sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    /* ── Card styles ────────────────────────────────────────────────── */
    .card {
      width: 900px;
      padding: 42px 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* backdrop blur for glassmorphism feel */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      /* GSAP controls opacity & x — start hidden, far left */
      opacity: 0;
    }

    .card-accent {
      width: 4px;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 12px 0 0 12px;
    }

    .card-inner {
      position: relative;
      padding-left: 24px;
    }

    .card-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .card-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    /* Per-card accent colours */
    #card1 .card-title  { color: #f59e0b; }
    #card1 .card-accent { background: #f59e0b; }
    #card1 { border-left-color: rgba(245, 158, 11, 0.3); }

    #card2 .card-title  { color: #ef4444; }
    #card2 .card-accent { background: #ef4444; }
    #card2 { border-left-color: rgba(239, 68, 68, 0.3); }

    #card3 .card-title  { color: #ffffff; }
    #card3 .card-accent { background: rgba(255,255,255,0.6); }
    #card3 { border-left-color: rgba(255, 255, 255, 0.2); }

    /* ── Centre closing statement ───────────────────────────────────── */
    #closing {
      position: absolute;
      top: 50%;
      left: 50%;
      /* transform set by GSAP via x/y to avoid CSS conflict */
      font-size: 32px;
      font-style: italic;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.06em;
      white-space: nowrap;
      opacity: 0;
    }

    /* Cards container — needed so we can dim them as a group */
    #cards-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="scene4"
    data-start="0"
    data-duration="10"
    data-width="1920"
    data-height="1080"
    data-fps="30"
  >
    <div id="cards-group">
      <!-- Card 1: Iridium collision -->
      <div class="card" id="card1">
        <div class="card-inner">
          <div class="card-accent"></div>
          <div class="card-title">IRIDIUM 33 × COSMOS 2251</div>
          <div class="card-subtitle">2009 — First major satellite collision</div>
        </div>
      </div>

      <!-- Card 2: Probability -->
      <div class="card" id="card2">
        <div class="card-inner">
          <div class="card-accent"></div>
          <div class="card-title">Collision Probability: ~1.0</div>
          <div class="card-subtitle">ACCIDENT dataset — confirmed impact</div>
        </div>
      </div>

      <!-- Card 3: Debris -->
      <div class="card" id="card3">
        <div class="card-inner">
          <div class="card-accent"></div>
          <div class="card-title">Debris field: 2,000+ pieces</div>
          <div class="card-subtitle">Still tracked today</div>
        </div>
      </div>
    </div>

    <!-- Closing statement (overlaid, centered) -->
    <div id="closing">This cannot happen again.</div>
  </div>

  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      // Centre the closing text via JS so GSAP owns all transforms
      const closing = document.getElementById('closing');
      closing.style.marginLeft = '-' + (closing.offsetWidth / 2) + 'px';
      closing.style.marginTop  = '-' + (closing.offsetHeight / 2) + 'px';

      // ── Master timeline ───────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // Shared card slide-in config: fromTo so GSAP owns x from the start
      const cardFrom = { opacity: 0, x: -140 };
      const cardTo   = (delay) => ({
        opacity: 1,
        x: 0,
        duration: 0.55,
        ease: 'power3.out',
      });

      // Card 1 — at 1s
      tl.fromTo('#card1', cardFrom, cardTo(), 1.0);

      // Card 2 — at 3s
      tl.fromTo('#card2', cardFrom, cardTo(), 3.0);

      // Card 3 — at 5s
      tl.fromTo('#card3', cardFrom, cardTo(), 5.0);

      // 8s: dim all cards to 30%
      tl.to('#cards-group', {
        opacity: 0.3,
        duration: 0.6,
        ease: 'power2.inOut',
      }, 8.0);

      // 9s: closing statement fades in
      tl.to('#closing', {
        opacity: 1,
        duration: 0.7,
        ease: 'power2.out',
      }, 9.0);

      // 10s: hold (timeline ends)

      // ── Register with HyperFrames ─────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      window.__timelines['scene4'] = tl;
    })();
  </script>
</body>
</html>
