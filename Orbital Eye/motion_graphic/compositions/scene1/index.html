<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Orbital Eye — Scene 1</title>
    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- GSAP 3.12.5 via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0a0a0f;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background-color: #0a0a0f;
        overflow: hidden;
      }
      /* Center white dot: crisp, no glow, pure white */
      #dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background-color: #ffffff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        pointer-events: none;
      }
      /* Subtitle text: Space Grotesk 28px, white, letter-spacing 0.1em */
      #text {
        position: absolute;
        top: calc(50% + 52px);
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: #ffffff;
        letter-spacing: 0.1em;
        white-space: nowrap;
        text-align: center;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene1"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="dot" class="clip" data-start="1.5" data-duration="4.5"></div>
      <div id="text" class="clip" data-start="3" data-duration="2.5">
        27,000 objects orbit Earth right now.
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Timeline sequence (Duration: 6.0s)
      // 0.0s - 1.5s: Pure black silence (dot & text hidden)
      tl.set("#dot", { opacity: 0 }, 0);
      tl.set("#text", { opacity: 0 }, 0);

      // 1.5s: Single white dot appears center screen (sharp arrival)
      tl.to("#dot", { opacity: 1, duration: 0.1, ease: "power1.in" }, 1.5);

      // 3.0s: Text fades in slowly: "27,000 objects orbit Earth right now."
      tl.fromTo(
        "#text",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
        3.0
      );

      // 5.0s: Text fades out. Dot remains.
      tl.to("#text", { opacity: 0, duration: 0.6, ease: "power2.in" }, 5.0);

      // 6.0s: Cut to black
      tl.to("#dot", { opacity: 0, duration: 0.05 }, 5.95);

      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
