[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers let the suite be split by dependency, e.g.
#   pytest -m "not db"        -> skip everything that needs a live Oracle DB
#   pytest -m "db"            -> only the live database connection tests
#   pytest -m "not slow"      -> skip the long-running build/live tests
markers =
    db: requires a live Oracle 21c database connection
    live: requires a running backend or frontend server
    slow: long-running test (production builds, full-stack probes)
    frontend: frontend source or build verification

# asyncio_mode=auto lets plain `async def test_...` functions run without an
# explicit @pytest.mark.asyncio decorator on every single test.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # Pydantic v2 deprecates the `example=` keyword on Field() in favour of
    # `json_schema_extra`. The schemas use the legacy form, which produces one
    # warning per model field and drowns out the real test output.
    ignore:Using extra keyword arguments on `Field` is deprecated:DeprecationWarning
    ignore::DeprecationWarning:redis.*
