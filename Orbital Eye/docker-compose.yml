version: '3.9'

services:
  # Oracle listener service (optional — relies on external Oracle instance)
  # Note: This project connects to an external Oracle DB (XEPDB1) via .env.
  # The backend reads ORACLE_HOST, ORACLE_PORT, ORACLE_SERVICE from .env.

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: orbital-eye-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ORACLE_USER=${ORACLE_USER:-ORBITAL_EYE}
      - ORACLE_PASS=${ORACLE_PASS}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_HOST=${DOCKER_ORACLE_HOST:-host.docker.internal}
      - ORACLE_PORT=${ORACLE_PORT:-1521}
      - ORACLE_SERVICE=${ORACLE_SERVICE:-XEPDB1}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ./backend:/app/backend:ro
    restart: "no"
    networks:
      - orbital-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: orbital-eye-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - orbital-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: orbital-eye-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_BACKEND_URL=http://backend:8000
      - DOCKER=true
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    restart: "no"
    networks:
      - orbital-net
    depends_on:
      - backend

networks:
  orbital-net:
    driver: bridge
