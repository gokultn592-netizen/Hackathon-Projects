<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Command Center</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for on-the-fly JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Recharts (just in case they need it) -->
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #0a0a0a; color: white; }
        #root { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Expose Recharts to window if needed -->
    <script>
        if (window.Recharts) {
            window.LineChart = window.Recharts.LineChart;
            window.Line = window.Recharts.Line;
            window.XAxis = window.Recharts.XAxis;
            window.YAxis = window.Recharts.YAxis;
            window.CartesianGrid = window.Recharts.CartesianGrid;
            window.Tooltip = window.Recharts.Tooltip;
            window.Legend = window.Recharts.Legend;
            window.ResponsiveContainer = window.Recharts.ResponsiveContainer;
            window.BarChart = window.Recharts.BarChart;
            window.Bar = window.Recharts.Bar;
        }
    </script>

    <!-- Load the main React component -->
    <script type="text/babel" src="./src/frontend/FloodCommandCenter.jsx"></script>
    
    <!-- Render the application -->
    <script type="text/babel">
        // Wait for the component to attach to window
        setTimeout(() => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<window.FloodCommandCenter />);
        }, 100);
    </script>
</body>
</html>
