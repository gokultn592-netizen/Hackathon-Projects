<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Command Center - Bihar Disaster Management</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & ReactDOM & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      color: #f3f4f6;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Load FloodCommandCenter component -->
  <script type="text/babel" src="./src/frontend/FloodCommandCenter.jsx"></script>

  <!-- Mount Component -->
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);

    function mountApp() {
      if (window.FloodCommandCenter) {
        root.render(React.createElement(window.FloodCommandCenter));
      } else {
        setTimeout(mountApp, 50);
      }
    }

    mountApp();
  </script>
</body>
</html>
